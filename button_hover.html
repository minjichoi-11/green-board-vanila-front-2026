<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            button {
                width: 100px;
                height: 100px;
                background-color: rgb(156, 98, 198);
                text-align: center;
                color: white;
                margin-left: auto;
                margin-right: auto;
            }

            button:hover {
                transform: rotateX(50deg);
                background-color: rgb(68, 47, 255);
                color: black;
                cursor: pointer;
            }
        </style>
        
    </head>
    <body>
        <button type="button">제출하기</button>
    </body>
</html>
