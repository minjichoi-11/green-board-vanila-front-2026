<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>상품 소개 페이지</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Noto+Sans+KR:wght@100..900&display=swap');
        h1 {
            font-size: 42px; /*글자 크기*/
            font-family: "Bitcount Ink", system-ui;
        }
        .accent { /*.이 붙은 건 클래스*/
            font-size: 24px; /*글자 크기*/
            font-weight: 900; /*글자 굵기*/
        }
        .italic {
            font-weight: bold; /*글자 굵기*/
            font-style: italic; /*글자 스타일*/
        }
    </style>
</head>
<body>
    <h1>red</h1>
    <p>껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 불린다.</p>
    <p class="italic">일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
</body>
