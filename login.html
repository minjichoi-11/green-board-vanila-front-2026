<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>로그인 | 게시판</title>
    </head>
    <body>
        <header>
            <!--헤더 영역-->
            <a class="brand" href="index.html">게시판</a>
            <nav>
                <a href="index.html">게시판</a>
                <a class="write-link" href="write.html">글쓰기</a>
                <a class="login-link" href="login.html">로그인</a>
                <button class="logout-button" type="button">로그아웃</button>
            </nav>
        </header>
        <main>
            <h1>로그인</h1>
            <form id="login-form">
                <label>아이디: </label>
                <input id="username" type="text" required placeholder="아이디를 입력하세요">
                <label>비밀번호: </label>
                <input id="password" type="password" required>
                <button type="button">로그인</button>
            </form>
        </main>
            <h1>글쓰기</h1>
            <form id="post-form">
                <label>제목</label>
                <input id="title" type="text" required>
                <label>본문</label>
                <textarea id="content" type="text" required></textarea>
                <button type="submit">게시글 등록</button>
                <a href="index.html">목록으로</a>
            </form>
        <footer>
            게시판 실습
        </footer>
    </body>
</html>
